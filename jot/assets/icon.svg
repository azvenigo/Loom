<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="grey"><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="sheen" cx="0.28" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3f5f7"/>
      <stop offset="0.3" stop-color="#a7adb3"/>
      <stop offset="0.62" stop-color="#3c4045"/>
      <stop offset="1" stop-color="#16181a"/>
    </linearGradient>
    <linearGradient id="rimInner" x1="0.8" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#d9dde1"/>
      <stop offset="0.45" stop-color="#5a5f65"/>
      <stop offset="1" stop-color="#101112"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1b1d20"/>
      <stop offset="1" stop-color="#060707"/>
    </radialGradient>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="250" y1="760" x2="512" y2="512">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffa04a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset="0.3" stop-color="#ffb877"/>
      <stop offset="0.7" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#b8400c"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="wellClip"><circle cx="512" cy="512" r="338"/></clipPath>
  </defs>

  <!-- Graphite plate: the real scan, neutralised, under a top-left sheen and a falling shade. -->
  <image href="graphite.jpg" x="0" y="0" width="1024" height="1024" filter="url(#grey)"/>
  <rect width="1024" height="1024" fill="#000" opacity="0.18"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#shade)"/>

  <!-- Bezel: brushed rim, then the dark well it holds. -->
  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="380" fill="url(#rim)"/>
  </g>
  <circle cx="512" cy="512" r="352" fill="url(#rimInner)"/>
  <circle cx="512" cy="512" r="338" fill="url(#well)"/>
  <g clip-path="url(#wellClip)">
    <circle cx="512" cy="530" r="338" fill="none" stroke="#000" stroke-width="40" opacity="0.75" filter="url(#inset)"/>
  </g>

  <!-- Dial ticks: twelve hours, quiet. -->
  <g stroke="#fff" stroke-linecap="round">
    <g stroke-opacity="0.34" stroke-width="9">
      <line x1="512" y1="196" x2="512" y2="234"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(30 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(60 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(90 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(120 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(150 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(180 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(210 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(240 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(270 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(300 512 512)"/>
      <line x1="512" y1="196" x2="512" y2="234" transform="rotate(330 512 512)"/>
    </g>
  </g>

  <!-- Threads gathering to the point: glow pass, then the threads themselves. -->
  <g fill="none" stroke="url(#thread)" stroke-linecap="round">
    <g opacity="0.5" filter="url(#soft)">
      <path d="M182 524 C300 540 420 530 512 512" stroke-width="12"/>
      <path d="M202 625 C320 640 430 560 512 512" stroke-width="14"/>
      <path d="M259 724 C360 720 440 590 512 512" stroke-width="14"/>
      <path d="M347 798 C420 770 470 620 512 512" stroke-width="14"/>
      <path d="M455 837 C480 760 500 640 512 512" stroke-width="12"/>
    </g>
    <path d="M182 524 C300 540 420 530 512 512" stroke-width="4"/>
    <path d="M202 625 C320 640 430 560 512 512" stroke-width="6"/>
    <path d="M259 724 C360 720 440 590 512 512" stroke-width="7"/>
    <path d="M347 798 C420 770 470 620 512 512" stroke-width="6"/>
    <path d="M455 837 C480 760 500 640 512 512" stroke-width="4"/>
  </g>

  <!-- The jot: one lit point. -->
  <circle cx="512" cy="512" r="120" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="40" fill="url(#dot)"/>
  <circle cx="512" cy="512" r="40" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
</svg>
